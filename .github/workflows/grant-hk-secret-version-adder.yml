name: Grant HK Secret Version Adder

# One-shot: bind roles/secretmanager.secretVersionAdder on the three HK LongPort
# secrets to the existing deploy SA. No secret values are handled.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Must be GRANT_HK_VERSION_ADDER"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: grant-hk-secret-version-adder
  cancel-in-progress: false

jobs:
  grant:
    if: >-
      github.repository == 'QuantStrategyLab/LongBridgePlatform'
      && github.ref == 'refs/heads/main'
      && github.run_attempt == 1
      && inputs.confirm == 'GRANT_HK_VERSION_ADDER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: longbridgequant
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com
      DEPLOY_SA_MEMBER: serviceAccount:longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com
      ROLE: roles/secretmanager.secretVersionAdder
    steps:
      - name: Authenticate to Google Cloud (deploy SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Bind secretVersionAdder on the three HK secrets
        run: |
          set -euo pipefail
          secrets=(longport_token_hk longport-app-key-hk longport-app-secret-hk)
          for secret_name in "${secrets[@]}"; do
            echo "binding role=${ROLE} member=${DEPLOY_SA_MEMBER} secret=${secret_name}"
            if ! gcloud secrets add-iam-policy-binding "$secret_name" \
              --project="$GCP_PROJECT_ID" \
              --member="$DEPLOY_SA_MEMBER" \
              --role="$ROLE" \
              --condition=None \
              --quiet; then
              echo "FAILED secret=${secret_name} role=${ROLE}" >&2
              exit 1
            fi
            echo "bound secret=${secret_name}"
          done
          echo "grant_complete=true"
