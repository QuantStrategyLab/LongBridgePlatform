name: Runtime Target Lifecycle

on:
  workflow_run:
    workflows: ["Deploy Cloud Run", "Stop HK Runtime"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: "Runtime target to inspect and publish. This workflow never enables a target or submits an order."
        required: true
        default: all
        type: choice
        options:
          - all
          - paper
          - hk
          - sg
  schedule:
    - cron: "17 * * * *"

env:
  GCP_PROJECT_ID: longbridgequant
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-matrix:
    name: Resolve runtime-target matrix
    if: github.event_name != 'workflow_run' || github.event.workflow_run.display_title != 'Image-only no-traffic staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.render.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Render validated matrix from public manifest
        id: render
        run: |
          set -euo pipefail
          python3 scripts/render_runtime_target_matrix.py --profile lifecycle --github-output

  lifecycle:
    needs: resolve-matrix
    if: github.event_name != 'workflow_run' || github.event.workflow_run.display_title != 'Image-only no-traffic staging'
    name: Publish ${{ matrix.target.label }} target lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    environment: ${{ matrix.target.environment }}
    env:
      RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED }}
      RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
      LONGBRIDGE_DRY_RUN_ONLY: ${{ vars.LONGBRIDGE_DRY_RUN_ONLY }}
      RUNTIME_GUARD_LOOKBACK_MINUTES: ${{ vars.RUNTIME_GUARD_LOOKBACK_MINUTES || '180' }}
      RUNTIME_GUARD_REQUIRE_SUCCESS: ${{ vars.RUNTIME_GUARD_REQUIRE_SUCCESS || 'false' }}
      RUNTIME_GUARD_SCHEDULER_JOB_PATTERN: ${{ matrix.target.service }}
      RUNTIME_HEARTBEAT_GCS_URIS: ${{ vars.RUNTIME_HEARTBEAT_GCS_URIS || vars.EXECUTION_REPORT_GCS_URI }}
      RUNTIME_HEARTBEAT_LOOKBACK_HOURS: ${{ vars.RUNTIME_HEARTBEAT_LOOKBACK_HOURS || '36' }}
      RUNTIME_HEARTBEAT_ACCEPT_STATUSES: ${{ vars.RUNTIME_HEARTBEAT_ACCEPT_STATUSES }}
      RUNTIME_HEARTBEAT_REJECT_STATUSES: ${{ vars.RUNTIME_HEARTBEAT_REJECT_STATUSES }}
      RUNTIME_HEARTBEAT_MARKET_AWARE: ${{ vars.RUNTIME_HEARTBEAT_MARKET_AWARE || 'true' }}
      RUNTIME_HEARTBEAT_MARKET_CALENDAR: ${{ vars.LONGBRIDGE_MARKET_CALENDAR }}
      RUNTIME_HEARTBEAT_MARKET_TIMEZONE: ${{ vars.LONGBRIDGE_MARKET_TIMEZONE }}
      RUNTIME_HEARTBEAT_PUBLICATION_GRACE_MINUTES: ${{ vars.RUNTIME_HEARTBEAT_PUBLICATION_GRACE_MINUTES || '30' }}
      RUNTIME_HEARTBEAT_SCHEDULER_AWARE: ${{ vars.RUNTIME_HEARTBEAT_SCHEDULER_AWARE || 'true' }}
      RUNTIME_HEARTBEAT_SCHEDULER_LOCATION: ${{ vars.RUNTIME_HEARTBEAT_SCHEDULER_LOCATION || matrix.target.region }}
      RUNTIME_HEARTBEAT_EXPECTED_DAY_OF_MONTH: ${{ vars.RUNTIME_HEARTBEAT_EXPECTED_DAY_OF_MONTH }}
      RUNTIME_HEARTBEAT_EXPECTED_TIMEZONE: ${{ vars.RUNTIME_HEARTBEAT_EXPECTED_TIMEZONE }}
      EXECUTION_EVIDENCE_SYNC_URL: ${{ vars.EXECUTION_EVIDENCE_SYNC_URL }}
      LIFECYCLE_PERFORMANCE_BUCKET: ${{ vars.LIFECYCLE_PERFORMANCE_BUCKET }}
      PRODUCTION_DRIFT_DOMAIN: ${{ vars.PRODUCTION_DRIFT_DOMAIN }}
      PRODUCTION_DRIFT_STRATEGY_PROFILE: ${{ vars.PRODUCTION_DRIFT_STRATEGY_PROFILE }}
    steps:
      - name: Select requested target
        id: selection
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
          TARGET_ID: ${{ matrix.target.id }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TARGET" in
            all|"$TARGET_ID") echo "selected=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "selected=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout repository
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: actions/checkout@v6

      - name: Set up uv
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install locked runtime dependencies
        if: ${{ steps.selection.outputs.selected == 'true' }}
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      - name: Authenticate to Google Cloud
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: ${{ steps.selection.outputs.selected == 'true' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Read the deployed PAPER candidate state
        if: ${{ steps.selection.outputs.selected == 'true' && matrix.target.id == 'paper' }}
        id: candidate_state
        env:
          CLOUD_RUN_SERVICE: ${{ matrix.target.service }}
          CLOUD_RUN_REGION: ${{ matrix.target.region }}
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project="$GCP_PROJECT_ID" --region="$CLOUD_RUN_REGION" --format=json)"
          SERVICE_JSON="$service_json" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          service = json.loads(os.environ["SERVICE_JSON"])
          containers = ((service.get("spec") or {}).get("template") or {}).get("spec", {}).get("containers", [])
          env = {str(item.get("name") or ""): str(item.get("value") or "") for item in (containers[0].get("env", []) if containers else []) if isinstance(item, dict)}
          raw = env.get("LONGBRIDGE_V7_PAPER_APPLICATION_JSON", "").strip()
          if not raw:
              print("candidate=false")
              raise SystemExit(0)
          try:
              binding = json.loads(raw)
              target = json.loads(env.get("RUNTIME_TARGET_JSON", "{}"))
          except json.JSONDecodeError:
              raise SystemExit(2)
          if not isinstance(binding, dict) or not isinstance(target, dict) or binding.get("strategy_profile") != "soxl_soxx_core_only_p2_v7_longterm_compounding_cash_reserve" or target.get("execution_environment") != "paper":
              raise SystemExit(2)
          enabled = str(env.get("RUNTIME_TARGET_ENABLED", "true")).strip().lower()
          if enabled not in {"true", "false"}:
              raise SystemExit(2)
          print("candidate=true")
          print(f"configured_state={'enabled' if enabled == 'true' else 'disabled'}")
          print("execution_mode=paper")
          PY

      - name: Resolve declared no-order target state
        if: ${{ steps.selection.outputs.selected == 'true' }}
        id: target_state
        env:
          FALLBACK_MODE: ${{ matrix.target.id == 'paper' && 'paper' || 'live' }}
          CANDIDATE_STATE: ${{ steps.candidate_state.outputs.candidate || 'false' }}
          CANDIDATE_CONFIGURED_STATE: ${{ steps.candidate_state.outputs.configured_state || '' }}
          CANDIDATE_EXECUTION_MODE: ${{ steps.candidate_state.outputs.execution_mode || '' }}
        run: |
          set -euo pipefail
          if [ "$CANDIDATE_STATE" = "true" ]; then
            printf 'configured_state=%s\n' "$CANDIDATE_CONFIGURED_STATE" >> "$GITHUB_OUTPUT"
            printf 'execution_mode=%s\n' "$CANDIDATE_EXECUTION_MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          enabled = (os.environ.get("RUNTIME_TARGET_ENABLED") or "true").strip().lower()
          if enabled not in {"true", "false"}:
              raise SystemExit("RUNTIME_TARGET_ENABLED must be true or false")

          mode = ""
          raw_target = (os.environ.get("RUNTIME_TARGET_JSON") or "").strip()
          if raw_target:
              try:
                  target = json.loads(raw_target)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"RUNTIME_TARGET_JSON is invalid: {error}") from error
              if isinstance(target, dict):
                  mode = str(target.get("execution_mode") or "").strip()

          if mode not in {"dry_run", "paper", "live"}:
              dry_run_only = (os.environ.get("LONGBRIDGE_DRY_RUN_ONLY") or "").strip().lower()
              mode = "dry_run" if dry_run_only == "true" else os.environ["FALLBACK_MODE"]

          print(f"configured_state={'enabled' if enabled == 'true' else 'disabled'}")
          print(f"execution_mode={mode}")
          PY

      - name: Check Cloud Run runtime without notification side effects
        if: ${{ steps.selection.outputs.selected == 'true' }}
        id: runtime_guard
        env:
          RUNTIME_GUARD_NAME: LongBridgePlatform ${{ matrix.target.label }} lifecycle
          RUNTIME_GUARD_CLOUD_RUN_SERVICES: ${{ matrix.target.service }}
          CLOUD_RUN_SERVICE: ${{ matrix.target.service }}
          CLOUD_RUN_REGION: ${{ matrix.target.region }}
          RUNTIME_GUARD_FAIL_WORKFLOW_ON_ALERT: "true"
          RUNTIME_GUARD_CHECK_SCHEDULER: "true"
        run: |
          set -uo pipefail
          set +e
          uv run --no-sync python scripts/cloud_run_runtime_guard.py > runtime-guard.log 2>&1
          exit_code=$?
          set -e
          cat runtime-guard.log
          if [ "$exit_code" -eq 0 ]; then
            status=pass
          elif grep -Eqi 'log query failed|internal error|network|timed out|unable to list|traceback|importerror|modulenotfounderror' runtime-guard.log; then
            status=unavailable
          else
            status=attention
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check enabled execution heartbeat without notification side effects
        if: ${{ steps.selection.outputs.selected == 'true' }}
        id: execution_heartbeat
        env:
          RUNTIME_HEARTBEAT_NAME: LongBridgePlatform ${{ matrix.target.label }} lifecycle
          RUNTIME_HEARTBEAT_REPORT_PLATFORM: longbridge
          RUNTIME_HEARTBEAT_ACCOUNT_SCOPE: ${{ matrix.target.account_scope }}
          RUNTIME_HEARTBEAT_REQUIRED_SERVICES: ${{ matrix.target.service }}
          RUNTIME_HEARTBEAT_FAIL_WORKFLOW_ON_ALERT: "true"
          CLOUD_RUN_SERVICE: ${{ matrix.target.service }}
          CLOUD_RUN_REGION: ${{ matrix.target.region }}
        run: |
          set -uo pipefail
          if [ "${{ steps.target_state.outputs.configured_state }}" = "disabled" ]; then
            echo "status=not_applicable" >> "$GITHUB_OUTPUT"
            echo "Execution heartbeat is not applicable because this target is deliberately disabled."
            exit 0
          fi

          set +e
          uv run --no-sync python scripts/execution_report_heartbeat.py > execution-heartbeat.log 2>&1
          exit_code=$?
          set -e
          cat execution-heartbeat.log
          if [ "$exit_code" -eq 0 ] && grep -qi 'heartbeat skipped' execution-heartbeat.log; then
            status=not_due
          elif [ "$exit_code" -eq 0 ]; then
            status=pass
          elif grep -Eqi 'gcloud|storage|network|timed out|internal error|unable to list|traceback|importerror|modulenotfounderror' execution-heartbeat.log; then
            status=unavailable
          else
            status=attention
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Observe production drift without optimization side effects
        if: ${{ steps.selection.outputs.selected == 'true' }}
        id: production_drift
        run: |
          set -uo pipefail
          set +e
          uv run --no-sync python scripts/production_drift_health_observe.py > production-drift.log 2>&1
          exit_code=$?
          set -e
          cat production-drift.log
          if [ "$exit_code" -ne 0 ]; then
            status=unavailable
          else
            status="$(python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("production-drift.log").read_text().strip().splitlines()
          payload = {}
          for line in reversed(raw):
              line = line.strip()
              if line.startswith("{") and line.endswith("}"):
                  payload = json.loads(line)
                  break
          status = str(payload.get("status") or "unavailable").strip().lower()
          if status in {"healthy", "parked"}:
              print("pass" if status == "healthy" else "not_due")
          elif status in {"review", "critical", "watch"}:
              print("attention")
          else:
              print("unavailable")
          PY
            )"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Detect unified control-plane ingress
        if: ${{ steps.selection.outputs.selected == 'true' }}
        id: lifecycle_ingress
        env:
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${EXECUTION_EVIDENCE_SYNC_URL:-}" ] && [ -n "${EXECUTION_EVIDENCE_SYNC_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish lifecycle to the unified control plane
        if: ${{ steps.selection.outputs.selected == 'true' && steps.lifecycle_ingress.outputs.enabled == 'true' }}
        uses: QuantStrategyLab/QuantRuntimeSettings/actions/publish-runtime-target-lifecycle@bbacba04baccbca91e4ba59c4dcaf460847e29f7
        with:
          source-id: longbridge.${{ matrix.target.id }}
          target-id: longbridge.${{ matrix.target.id }}
          platform: longbridge
          configured-state: ${{ steps.target_state.outputs.configured_state }}
          execution-mode: ${{ steps.target_state.outputs.execution_mode }}
          runtime-guard: ${{ steps.runtime_guard.outputs.status }}
          execution-heartbeat: ${{ steps.execution_heartbeat.outputs.status }}
          sync-url: ${{ env.EXECUTION_EVIDENCE_SYNC_URL }}
          observe-gcp: "true"
          gcp-project: ${{ env.GCP_PROJECT_ID }}
          cloud-run-region: ${{ matrix.target.region }}
          cloud-run-service: ${{ matrix.target.service }}
          scheduler-location: ${{ matrix.target.region }}
        env:
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}

      - name: Explain missing lifecycle ingress configuration
        if: ${{ steps.selection.outputs.selected == 'true' && steps.lifecycle_ingress.outputs.enabled != 'true' }}
        run: |
          echo "Lifecycle was checked but not centrally published: configure EXECUTION_EVIDENCE_SYNC_URL and EXECUTION_EVIDENCE_SYNC_TOKEN on this GitHub Environment." >&2
          {
            echo "## Runtime target lifecycle"
            echo
            echo "Checks completed locally, but the unified control-plane ingress is not configured for this environment."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize no-order lifecycle
        if: ${{ steps.selection.outputs.selected == 'true' }}
        run: |
          {
            echo "## Runtime target lifecycle"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Target | longbridge.${{ matrix.target.id }} |"
            echo "| Configured state | ${{ steps.target_state.outputs.configured_state }} |"
            echo "| Intended lane | ${{ steps.target_state.outputs.execution_mode }} |"
            echo "| Runtime guard | ${{ steps.runtime_guard.outputs.status }} |"
            echo "| Execution heartbeat | ${{ steps.execution_heartbeat.outputs.status }} |"
            echo "| Production drift | ${{ steps.production_drift.outputs.status }} |"
            echo
            echo "This workflow is read-only: it cannot enable a target, alter its lane, or submit an order."
          } >> "$GITHUB_STEP_SUMMARY"
