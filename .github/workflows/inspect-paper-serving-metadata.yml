name: Inspect PAPER Serving Metadata

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read serving images, existing source-chain records, or only PAPER Russell configuration.
        required: true
        type: choice
        default: serving-image
        options:
          - serving-image
          - source-chain
          - target-config
          - plain-dca

permissions:
  contents: read

concurrency:
  group: Deploy Cloud Run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: longbridge-paper
    permissions:
      contents: read
      id-token: write
    env:
      WORKFLOW_TARGET: PAPER
      INSPECTION_MODE: ${{ inputs.mode }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      EXPECTED_RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
      WORKFLOW_ENVIRONMENT: longbridge-paper
      EXPECTED_PHYSICAL_ACCOUNT_ID: ${{ secrets.LONGBRIDGE_PHYSICAL_ACCOUNT_ID }}
      EXPECTED_RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED || secrets.RUNTIME_TARGET_ENABLED }}
      EXPECTED_DRY_RUN_ONLY: ${{ vars.LONGBRIDGE_DRY_RUN_ONLY || secrets.LONGBRIDGE_DRY_RUN_ONLY }}
    steps:
      - name: Mask WIF identity components
        env:
          GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          account="$GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT"
          if ! [[ "$account" =~ ^[a-z0-9-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$ ]]; then
            printf '%s\n' '::error::Required Secret GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT is missing or malformed'
            exit 1
          fi
          account_name="${account%%@*}"
          project="${account#*@}"
          project="${project%.iam.gserviceaccount.com}"
          printf '::add-mask::%s\n' "$account_name"
          printf '::add-mask::%s\n' "$project"
          printf 'GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT=%s\n' "$account" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing PAPER selection before cloud authentication
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = QuantStrategyLab/LongBridgePlatform
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'GCP_PROJECT_ID=%s\n' "$GCP_PROJECT_ID" >> "$GITHUB_ENV"
          test -n "$CLOUD_RUN_REGION"
          test -n "$CLOUD_RUN_SERVICE"
          if [ "$INSPECTION_MODE" = target-config ]; then
            test -n "$GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen inspection dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --no-dev
      - name: Validate plain-DCA protected identity before cloud authentication
        if: inputs.mode == 'plain-dca'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: uv run --no-sync python -m scripts.inspect_plain_dca_paper --validate-config
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Read serving metadata without invoking the service
        run: |
          set -euo pipefail
          case "$INSPECTION_MODE" in
            serving-image) uv run --no-sync python -m scripts.inspect_paper_serving_metadata ;;
            source-chain) uv run --no-sync python -m scripts.inspect_paper_serving_metadata --source-chain ;;
            target-config) uv run --no-sync python -m scripts.inspect_paper_serving_metadata --target-config ;;
            plain-dca) uv run --no-sync python -m scripts.inspect_plain_dca_paper ;;
            *) exit 2 ;;
          esac
