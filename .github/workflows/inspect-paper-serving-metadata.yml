name: Inspect PAPER Serving Metadata

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read serving images, existing source-chain records, or only PAPER Russell configuration.
        required: true
        type: choice
        default: serving-image
        options:
          - serving-image
          - source-chain
          - target-config

permissions:
  contents: read

concurrency:
  group: Deploy Cloud Run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: longbridge-paper
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      WORKFLOW_TARGET: PAPER
      INSPECTION_MODE: ${{ inputs.mode }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      EXPECTED_RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing PAPER selection before cloud authentication
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = QuantStrategyLab/LongBridgePlatform
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUD_RUN_REGION"
          test -n "$CLOUD_RUN_SERVICE"
          if [ "$INSPECTION_MODE" = target-config ]; then
            test -n "$GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install frozen inspection dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --no-dev
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Read serving metadata without invoking the service
        run: |
          set -euo pipefail
          case "$INSPECTION_MODE" in
            serving-image) uv run --no-sync python -m scripts.inspect_paper_serving_metadata ;;
            source-chain) uv run --no-sync python -m scripts.inspect_paper_serving_metadata --source-chain ;;
            target-config) uv run --no-sync python -m scripts.inspect_paper_serving_metadata --target-config ;;
            *) exit 2 ;;
          esac
