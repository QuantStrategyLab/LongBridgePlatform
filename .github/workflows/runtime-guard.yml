name: Runtime Guard

on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "Cloud Logging lookback window in minutes."
        required: false
        type: string
        default: "180"
      require_success:
        description: "Alert if no HTTP 2xx/3xx response is logged; does not verify strategy cycles."
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
      fail_workflow_on_alert:
        description: "Fail this workflow when an alert is emitted."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
  schedule:
    - cron: "29,59 * * * *"

env:
  GCP_PROJECT_ID: longbridgequant
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main
  GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-matrix:
    name: Resolve runtime-target matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.render.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Render validated matrix from public manifest
        id: render
        run: |
          set -euo pipefail
          python3 scripts/render_runtime_target_matrix.py --profile guard --github-output

  guard:
    needs: resolve-matrix
    name: Check ${{ matrix.target.label }} Cloud Run and Scheduler logs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    environment: ${{ matrix.target.environment }}
    env:
      RUNTIME_GUARD_NAME: LongBridgePlatform ${{ matrix.target.label }}
      RUNTIME_GUARD_CLOUD_RUN_SERVICES: ${{ matrix.target.service }}
      RUNTIME_GUARD_LOOKBACK_MINUTES: ${{ inputs.lookback_minutes || vars.RUNTIME_GUARD_LOOKBACK_MINUTES || '180' }}
      RUNTIME_GUARD_REQUIRE_SUCCESS: ${{ inputs.require_success || vars.RUNTIME_GUARD_REQUIRE_SUCCESS || 'false' }}
      RUNTIME_GUARD_FAIL_WORKFLOW_ON_ALERT: ${{ inputs.fail_workflow_on_alert || vars.RUNTIME_GUARD_FAIL_WORKFLOW_ON_ALERT || 'true' }}
      RUNTIME_GUARD_SCHEDULER_JOB_PATTERN: ''
      RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED }}
      CLOUD_RUN_REGION: ${{ matrix.target.region }}
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TOKEN_SECRET_NAME: ${{ vars.TELEGRAM_TOKEN_SECRET_NAME }}
      # NOTIFY-04 B5: default dry_run = log would_suppress only, never suppress.
      RUNTIME_GUARD_ALERT_DEDUPE_MODE: ${{ vars.RUNTIME_GUARD_ALERT_DEDUPE_MODE || 'dry_run' }}
      RUNTIME_GUARD_ALERT_DEDUPE_REMINDER_HOURS: ${{ vars.RUNTIME_GUARD_ALERT_DEDUPE_REMINDER_HOURS || '6' }}
      RUNTIME_GUARD_DEDUPE_STATE_PATH: .runtime-guard-dedupe/state.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install locked runtime dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev

      # The public manifest duplicates RUNTIME_TARGET_JSON.strategy_profile and
      # friends; nothing else consumes strategy_profile, so only this explicit
      # comparison can catch a wrong-but-valid manifest value.
      - name: Verify public manifest matches Environment runtime target
        env:
          MANIFEST_TARGET_ID: ${{ matrix.target.id }}
          RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
          STRATEGY_PROFILE: ${{ vars.STRATEGY_PROFILE }}
        run: |
          set -euo pipefail
          uv run --no-sync python scripts/check_runtime_target_manifest_drift.py --target-id "${MANIFEST_TARGET_ID}"

      - name: Authenticate to Google Cloud
        id: gcp_auth_primary
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Wait before Google Cloud authentication retry
        if: ${{ steps.gcp_auth_primary.outcome == 'failure' }}
        run: sleep 10

      - name: Retry Google Cloud authentication
        if: ${{ steps.gcp_auth_primary.outcome == 'failure' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Restore runtime-guard alert dedupe state
        uses: actions/cache/restore@v4
        with:
          path: .runtime-guard-dedupe
          key: runtime-guard-dedupe-${{ matrix.target.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            runtime-guard-dedupe-${{ matrix.target.environment }}-

      - name: Check Cloud Scheduler and Cloud Run logs
        run: uv run --no-sync python scripts/cloud_run_runtime_guard.py

      - name: Save runtime-guard alert dedupe state
        if: ${{ always() && hashFiles('.runtime-guard-dedupe/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .runtime-guard-dedupe
          key: runtime-guard-dedupe-${{ matrix.target.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
