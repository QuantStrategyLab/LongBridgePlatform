name: Publish Daily Runtime Once

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish or run a read-only source and authentication preflight
        type: choice
        required: true
        default: publish
        options: [publish, preflight]
      nonce:
        description: Public 64-character lowercase hexadecimal comparison nonce for preflight
        type: string
        required: false
      target:
        description: Existing account target
        type: choice
        required: true
        default: paper
        options: [paper, sg, hk]

concurrency:
  group: runtime-daily-once-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ format('longbridge-{0}', inputs.target) }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: longbridgequant
      GOOGLE_CLOUD_PROJECT: longbridgequant
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com
      DAILY_TARGET: ${{ inputs.target }}
      DAILY_MODE: ${{ inputs.mode }}
      DAILY_BINDING_NONCE: ${{ inputs.nonce }}
      RUNTIME_HEARTBEAT_ACCOUNT_SCOPE: ${{ vars.ACCOUNT_REGION }}
      RUNTIME_HEARTBEAT_REPORT_PLATFORM: longbridge
      RUNTIME_HEARTBEAT_GCS_URIS: ${{ vars.RUNTIME_HEARTBEAT_GCS_URIS || vars.EXECUTION_REPORT_GCS_URI }}
      RUNTIME_HEARTBEAT_LOOKBACK_HOURS: ${{ vars.RUNTIME_HEARTBEAT_LOOKBACK_HOURS || '36' }}
      RUNTIME_HEARTBEAT_MAX_REPORTS_TO_READ: ${{ vars.RUNTIME_HEARTBEAT_MAX_REPORTS_TO_READ || '20' }}
      RUNTIME_HEARTBEAT_PUBLICATION_GRACE_MINUTES: ${{ vars.RUNTIME_HEARTBEAT_PUBLICATION_GRACE_MINUTES || '30' }}
      RUNTIME_HEARTBEAT_MARKET_AWARE: ${{ vars.RUNTIME_HEARTBEAT_MARKET_AWARE || 'true' }}
      RUNTIME_HEARTBEAT_MARKET_CALENDAR: ${{ vars.LONGBRIDGE_MARKET_CALENDAR }}
      RUNTIME_HEARTBEAT_MARKET_TIMEZONE: ${{ vars.LONGBRIDGE_MARKET_TIMEZONE }}
      RUNTIME_TARGET_ENABLED: ${{ vars.RUNTIME_TARGET_ENABLED }}
      RUNTIME_TARGET_JSON: ${{ vars.RUNTIME_TARGET_JSON || secrets.RUNTIME_TARGET_JSON }}
      RUNTIME_DAILY_PROJECTION_GCS_PREFIX: ${{ secrets.RUNTIME_DAILY_PROJECTION_GCS_PREFIX }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      ACCOUNT_HISTORY_EXPECTED_SOURCE_BINDING_ID: ${{ secrets.ACCOUNT_HISTORY_EXPECTED_SOURCE_BINDING_ID }}
    steps:
      - name: Check out publisher
        uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Install locked runtime dependencies
        run: |
          set -euo pipefail
          if ! uv sync --frozen --no-dev >"${RUNNER_TEMP}/daily-once-dependencies.log" 2>&1; then
            echo '{"status":"dependency_setup_unavailable","qrs_ack_valid":false}'
            exit 2
          fi
      - name: Validate target selection
        run: |
          set -euo pipefail
          case "${RUNTIME_TARGET_ENABLED}" in
            true|false) ;;
            *) echo '{"status":"selection_unavailable","qrs_ack_valid":false}'; exit 2 ;;
          esac
          case "${DAILY_TARGET}" in
            paper) expected_scope=PAPER ;;
            sg) expected_scope=SG ;;
            hk) expected_scope=HK ;;
            *) echo '{"status":"selection_unavailable","qrs_ack_valid":false}'; exit 2 ;;
          esac
          if [ "${RUNTIME_HEARTBEAT_ACCOUNT_SCOPE}" != "${expected_scope}" ] || \
             [ -z "${CLOUD_RUN_SERVICE}" ] || [ -z "${CLOUD_RUN_REGION}" ] || \
             { [ "${DAILY_TARGET}" = "paper" ] && [ -z "${RUNTIME_DAILY_PROJECTION_GCS_PREFIX}" ]; } || \
             { [ "${DAILY_TARGET}" != "paper" ] && [ -z "${ACCOUNT_HISTORY_EXPECTED_SOURCE_BINDING_ID}" ]; }; then
            echo '{"status":"selection_unavailable","qrs_ack_valid":false}'
            exit 2
          fi
      - name: Authenticate original protected identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      - name: Set up gcloud read client
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Create one truthful daily projection and verify QRS ACK
        env:
          EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
        run: |
          if [ "${DAILY_MODE}" = "preflight" ]; then
            uv run --no-sync python -m scripts.publish_daily_runtime_projection --live-preflight
          elif [ "${DAILY_TARGET}" = "paper" ]; then
            uv run --no-sync python -m scripts.publish_daily_runtime_projection --one-shot-paper
          else
            uv run --no-sync python -m scripts.publish_daily_runtime_projection --one-shot-live
          fi
