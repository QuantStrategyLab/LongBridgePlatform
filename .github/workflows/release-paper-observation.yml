name: Paper observation release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected release environment
        type: choice
        required: true
        options:
          - paper-collector-release
          - paper-watchdog-release
          - paper-release-test
      operation:
        description: Release operation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy
permissions: {}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    uses: QuantStrategyLab/.github/.github/workflows/deploy-job.yml@66c88dc5c4d46ff6beff7dec82a4bdd8f614663a
    with:
      provider: gcp-service
      environment: ${{ inputs.target }}
      operation: ${{ inputs.operation }}
