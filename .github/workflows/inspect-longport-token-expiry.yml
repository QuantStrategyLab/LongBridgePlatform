name: Inspect LongPort Token Expiry

# Read-only: decode JWT exp from Secret Manager token secrets.
# Never calls /v1/token/refresh, never adds SM versions, never prints secret values.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Account target whose Access Token JWT expiry to inspect."
        required: true
        type: choice
        options:
          - paper
          - hk
          - sg
      warn_days:
        description: "Fail when days remaining is below this threshold."
        required: false
        type: string
        default: "30"

permissions:
  contents: read

concurrency:
  group: inspect-longport-token-expiry-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'QuantStrategyLab/LongBridgePlatform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: longbridgequant
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com
      TARGET: ${{ inputs.target }}
      WARN_DAYS: ${{ inputs.warn_days }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (deploy SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Secret Manager client
        run: python -m pip install --quiet 'google-cloud-secret-manager>=2.20'

      - name: Inspect token expiry (names + days only)
        run: |
          set -euo pipefail
          python scripts/inspect_longport_token_expiry.py \
            --project "$GCP_PROJECT_ID" \
            --target "$TARGET" \
            --warn-days "$WARN_DAYS" | tee "$GITHUB_STEP_SUMMARY"
