name: Grant fixed PAPER executor IAM permissions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; apply needs a separate exact-revision run card
        type: choice
        options: [dry-run, apply]
        default: dry-run
        required: true
      approved_revision:
        description: Exact merged main SHA approved by the separate run card
        type: string
        required: true
      owner_run_card:
        description: Separate owner run-card reference; Environment reviewer verifies scope
        type: string
        required: true
      confirm:
        description: Must be GRANT_PAPER_EXECUTOR_FOUR_PERMISSIONS
        type: string
        required: true

permissions:
  contents: read

# Serialize with the existing scheduler IAM route; never cancel an IAM writer.
concurrency:
  group: paper-scheduler-jobs-get-iam
  cancel-in-progress: false

jobs:
  fixed-grant:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'QuantStrategyLab/LongBridgePlatform'
      && github.ref == 'refs/heads/main'
      && github.run_attempt == 1
      && inputs.approved_revision == github.sha
      && inputs.confirm == 'GRANT_PAPER_EXECUTOR_FOUR_PERMISSIONS'
      && (inputs.mode == 'dry-run' || inputs.mode == 'apply')
    environment: longbridge-paper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      IAM_MODE: ${{ inputs.mode }}
      IAM_CONFIRM: ${{ inputs.confirm }}
      IAM_APPROVED_REVISION: ${{ inputs.approved_revision }}
      IAM_OWNER_RUN_CARD: ${{ inputs.owner_run_card }}
    steps:
      # Exactly six grant-specific Environment Secrets transport compact, single-line
      # JSON envelopes. The runner must register each complete secret before
      # PrepareExecution prints evaluated env/with (in-action masking is too late).
      # Never use vars or a Variables API fallback. Trusted provisioning must bind
      # each envelope to this Environment and approved revision/run-card generation.
      # The secrets context cannot attest physical storage scope: independent
      # Environment-only provisioning evidence remains an operational prerequisite.
      - name: Mask protected mappings before exposing step environment
        uses: actions/github-script@v8
        env:
          MAPPING_GCP_PROJECT_ID: ${{ secrets.PAPER_GRANT_ENVELOPE_GCP_PROJECT_ID }}
          MAPPING_PAPER_SCHEDULER_GET_PROJECT_ID: ${{ secrets.PAPER_GRANT_ENVELOPE_PAPER_SCHEDULER_GET_PROJECT_ID }}
          MAPPING_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ secrets.PAPER_GRANT_ENVELOPE_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          MAPPING_PAPER_IAM_GRANT_RECIPIENT: ${{ secrets.PAPER_GRANT_ENVELOPE_PAPER_IAM_GRANT_RECIPIENT }}
          MAPPING_PAPER_IAM_BOOTSTRAP_SERVICE_ACCOUNT: ${{ secrets.PAPER_GRANT_ENVELOPE_PAPER_IAM_BOOTSTRAP_SERVICE_ACCOUNT }}
          MAPPING_PAPER_IAM_BOOTSTRAP_WIF_PROVIDER: ${{ secrets.PAPER_GRANT_ENVELOPE_PAPER_IAM_BOOTSTRAP_WIF_PROVIDER }}
        with:
          script: |
            const names = [
              'GCP_PROJECT_ID', 'PAPER_SCHEDULER_GET_PROJECT_ID',
              'GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT', 'PAPER_IAM_GRANT_RECIPIENT',
              'PAPER_IAM_BOOTSTRAP_SERVICE_ACCOUNT', 'PAPER_IAM_BOOTSTRAP_WIF_PROVIDER'
            ];
            const mappings = [];
            for (const name of names) {
              const scope = 'environment_secret';
              let category = 'blank_value';
              try {
                const raw = process.env['MAPPING_' + name];
                if (raw === undefined || raw === null || typeof raw !== 'string') {
                  category = 'malformed_response';
                  throw new Error('Invalid mapping response');
                }
                if (!raw.trim()) {
                  category = 'blank_value';
                  throw new Error('Empty mapping');
                }
                category = 'malformed_response';
                // Keep the entire transport unchanged until the runner has masked
                // its preparation output. Never log parsed or malformed content.
                if (/[\r\n]/.test(raw)) throw new Error('Multiline transport');
                const packet = JSON.parse(raw);
                if (!packet || Array.isArray(packet) || typeof packet !== 'object') {
                  throw new Error('Invalid envelope');
                }
                category = 'provenance_mismatch';
                const revision = process.env.IAM_APPROVED_REVISION;
                const card = process.env.IAM_OWNER_RUN_CARD;
                if (!/^[0-9a-f]{40}$/.test(revision || '') || !card?.trim()
                    || process.env.GITHUB_SHA !== revision
                    || process.env.GITHUB_REPOSITORY !== 'QuantStrategyLab/LongBridgePlatform'
                    || packet.version !== 1 || packet.name !== name
                    || packet.repository !== process.env.GITHUB_REPOSITORY
                    || packet.environment !== 'longbridge-paper' || packet.scope !== 'environment'
                    || packet.revision !== revision || packet.owner_run_card !== card) {
                  throw new Error('Envelope binding mismatch');
                }
                const value = packet.value;
                category = 'malformed_response';
                if (typeof value !== 'string' || /[\r\n\0]/.test(value)) {
                  throw new Error('Invalid mapping value');
                }
                category = 'blank_value';
                if (!value.trim()) throw new Error('Empty mapping value');
                core.setSecret(value);
                mappings.push([name, value]);
              } catch {
                throw new Error(`Protected mapping read failed: name=${name} scope=${scope} category=${category}; stop before authentication`);
              }
            }
            for (const [name, value] of mappings) core.exportVariable(name, value);
      - name: Verify Environment approval protection remains configured
        uses: actions/github-script@v8
        with:
          script: |
            let data;
            try {
              ({data} = await github.rest.repos.getEnvironment({
                ...context.repo, environment_name: 'longbridge-paper'
              }));
            } catch {
              throw new Error('Environment protection read failed');
            }
            const approval = data.protection_rules?.find(r => r.type === 'required_reviewers');
            if (!approval || !approval.reviewers || approval.reviewers.length < 1) {
              throw new Error('Required Environment approval protection is missing');
            }
      - name: Checkout exact protected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate fixed recipient and bootstrap mappings before authentication
        run: |
          python3 - <<'PY'
          import os
          from scripts.paper_executor_grant import identity
          identity(os.environ)
          if not os.environ.get('PAPER_IAM_BOOTSTRAP_WIF_PROVIDER'):
              raise SystemExit('BLOCKED: bootstrap WIF mapping missing')
          PY
      - name: Authenticate existing authorized bootstrap identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.PAPER_IAM_BOOTSTRAP_WIF_PROVIDER }}
          service_account: ${{ env.PAPER_IAM_BOOTSTRAP_SERVICE_ACCOUNT }}
      - name: Set up cloud client
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Read plan and apply only the fixed delta when separately authorized
        run: |
          set -euo pipefail
          IAM_MODE=dry-run python3 -m scripts.paper_executor_grant
          if [ "$IAM_MODE" = apply ]; then
            python3 -m scripts.paper_executor_grant
          fi
