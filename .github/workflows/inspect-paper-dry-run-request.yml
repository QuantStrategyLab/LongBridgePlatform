name: Inspect PAPER dry-run request

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: Inclusive UTC start (YYYY-MM-DDTHH:MM:SSZ)
        required: true
        type: string
      end_utc:
        description: Exclusive UTC end (within 15 minutes of start)
        required: true
        type: string

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: longbridge-paper
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main
          service_account: longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: longbridgequant
          version: ">= 416.0.0"
      - name: Inspect bounded request logs
        env:
          READBACK_START_UTC: ${{ inputs.start_utc }}
          READBACK_END_UTC: ${{ inputs.end_utc }}
        run: python scripts/paper_request_readback.py
