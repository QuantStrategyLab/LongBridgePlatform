name: Rotate LongPort Secrets

# Manual one-shot writer: adds Secret Manager versions from temporary repo secrets.
# Never echo credential values; print only secret names and new version resource names.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Account target whose LongPort Secret Manager credentials to rotate."
        required: true
        type: choice
        options:
          - paper
          - hk
          - sg

permissions:
  contents: read

concurrency:
  group: rotate-longport-secrets-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rotate:
    if: github.repository == 'QuantStrategyLab/LongBridgePlatform' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: longbridgequant
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: longbridge-platform-deploy@longbridgequant.iam.gserviceaccount.com
      TARGET: ${{ inputs.target }}
      ROTATE_LONGPORT_TOKEN: ${{ secrets.ROTATE_LONGPORT_TOKEN }}
      ROTATE_LONGPORT_APP_KEY: ${{ secrets.ROTATE_LONGPORT_APP_KEY }}
      ROTATE_LONGPORT_APP_SECRET: ${{ secrets.ROTATE_LONGPORT_APP_SECRET }}
    steps:
      - name: Authenticate to Google Cloud (deploy SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Add Secret Manager versions from temporary repo secrets
        id: add_versions
        run: |
          set -euo pipefail

          case "$TARGET" in
            paper)
              TOKEN_SECRET='longport_token_paper'
              APP_KEY_SECRET='longport-app-key-paper'
              APP_SECRET_SECRET='longport-app-secret-paper'
              ;;
            hk)
              TOKEN_SECRET='longport_token_hk'
              APP_KEY_SECRET='longport-app-key-hk'
              APP_SECRET_SECRET='longport-app-secret-hk'
              ;;
            sg)
              TOKEN_SECRET='longport_token_sg'
              APP_KEY_SECRET='longport-app-key-sg'
              APP_SECRET_SECRET='longport-app-secret-sg'
              ;;
            *)
              echo "unsupported target=${TARGET}" >&2
              exit 1
              ;;
          esac

          # GitHub already masks secrets.* interpolations; reinforce for any derived output.
          printf '::add-mask::%s\n' "$ROTATE_LONGPORT_TOKEN"
          printf '::add-mask::%s\n' "$ROTATE_LONGPORT_APP_KEY"
          printf '::add-mask::%s\n' "$ROTATE_LONGPORT_APP_SECRET"

          if [[ -z "${ROTATE_LONGPORT_TOKEN}" || -z "${ROTATE_LONGPORT_APP_KEY}" || -z "${ROTATE_LONGPORT_APP_SECRET}" ]]; then
            echo "Missing temporary repository secrets: ROTATE_LONGPORT_TOKEN / ROTATE_LONGPORT_APP_KEY / ROTATE_LONGPORT_APP_SECRET" >&2
            exit 1
          fi

          add_version() {
            local secret_name="$1"
            local secret_value="$2"
            local version_name
            # Pipe value on stdin only; never pass as argv or echo it.
            set +e
            version_name="$(printf '%s' "$secret_value" | gcloud secrets versions add "$secret_name" \
              --data-file=- \
              --project="$GCP_PROJECT_ID" \
              --format='value(name)')"
            status=$?
            set -e
            if [[ $status -ne 0 ]]; then
              echo "Failed to add version for secret=${secret_name} (gcloud exit=${status})" >&2
              exit 1
            fi
            if [[ -z "$version_name" ]]; then
              echo "Empty version resource for secret=${secret_name}" >&2
              exit 1
            fi
            echo "secret=${secret_name} version=${version_name}"
            echo "${secret_name}=${version_name}" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "target=${TARGET}"
          add_version "$TOKEN_SECRET" "$ROTATE_LONGPORT_TOKEN"
          add_version "$APP_KEY_SECRET" "$ROTATE_LONGPORT_APP_KEY"
          add_version "$APP_SECRET_SECRET" "$ROTATE_LONGPORT_APP_SECRET"
          echo "rotate_complete=true"
