[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longbridge-platform"
version = "0.3.0"
description = "QuantStrategyLab platform layer for LongBridge broker."
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "pandas",
    "requests",
    "pytz",
    "pandas-market-calendars",
    "google-cloud-secret-manager",
    "google-cloud-storage",
    "google-auth",
    "longport==3.0.23",
    "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@c17625ccaaa9b33592f5cf334ab3491fa1821fc3",
    "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@1d087fa424972d5d5ab02c4650ce9f039cb6711f",
    "hk-equity-strategies @ git+https://github.com/QuantStrategyLab/HkEquityStrategies.git@fe0c32e09d454ca4388c3372bf3874097b1bbaf0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
]

[tool.coverage.run]
branch = true
source = ["src/longbridge_platform"]
omit = ["tests/*", "*/external/*", ".venv/*", "build/*", "dist/*"]

[tool.coverage.report]
show_missing = true
include_namespace_packages = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"longbridge_platform.notifications" = ["display_names.json"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  ".",
]
testpaths = ["tests"]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@c17625ccaaa9b33592f5cf334ab3491fa1821fc3",
]
