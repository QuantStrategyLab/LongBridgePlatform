[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longbridge-platform"
version = "0.3.0"
description = "QuantStrategyLab platform layer for LongBridge broker."
requires-python = ">=3.11"
dependencies = [
    "flask",
    "gunicorn",
    "pandas",
    "requests",
    "pytz",
    "pandas-market-calendars",
    "google-cloud-secret-manager",
    "google-cloud-storage",
    "google-auth",
    "longport==3.0.23",
    "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@8ca0c533cdafba2a931e4b6b1e519a73c94f9e35",
    "us-equity-strategies @ git+https://github.com/QuantStrategyLab/UsEquityStrategies.git@056109bd717ea5e0415b9f94eb109e3dabb47604",
    "hk-equity-strategies @ git+https://github.com/QuantStrategyLab/HkEquityStrategies.git@1a982dc1a6b0f73803c27f9931638e73684d8e93",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "*/external/*"]

[tool.coverage.report]
show_missing = true

[tool.setuptools]
py-modules = [
  "decision_mapper",
  "main",
  "runtime_config_support",
  "runtime_execution_policy",
  "runtime_logging",
  "strategy_loader",
  "strategy_registry",
  "strategy_runtime",
]

[tool.setuptools.packages.find]
include = [
  "application*",
  "entrypoints*",
  "notifications*",
  "scripts*",
  "strategy*",
]

[tool.uv]
override-dependencies = [
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@8ca0c533cdafba2a931e4b6b1e519a73c94f9e35",
]
